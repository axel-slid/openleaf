name: Build and release Openleaf

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: openleaf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version v$package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Tectonic
        run: brew install tectonic

      - name: Validate source and regressions
        run: |
          npm run check
          npm test

      - name: Build native application
        env:
          OPENLEAF_SKIP_LATEX_CHECK: "1"
        run: npm run package:mac

      - name: Verify native application
        run: |
          test -d "dist/mac/Openleaf.app"
          test "$(file "dist/mac/Openleaf.app/Contents/MacOS/Electron")" != ""
          codesign --verify --deep --strict "dist/mac/Openleaf.app"

      - name: Archive application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/mac/Openleaf.app" \
            "dist/Openleaf-macOS-arm64.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Openleaf-macOS-arm64
          path: dist/Openleaf-macOS-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download native build
        uses: actions/download-artifact@v4
        with:
          name: Openleaf-macOS-arm64
          path: release

      - name: Generate checksum
        working-directory: release
        run: sha256sum Openleaf-macOS-arm64.zip > SHA256SUMS.txt

      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes \
              --title "Openleaf $RELEASE_TAG" \
              --repo "$REPOSITORY"
